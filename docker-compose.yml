# Postgres local. La misma versión mayor que Railway y que el VPS de IONOS:
# un cambio de versión mayor convierte una mudanza en una tarde de depuración.
services:
  postgres:
    image: postgres:16.6-alpine
    container_name: aiuto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiuto
      POSTGRES_PASSWORD: aiuto_local
      POSTGRES_DB: aiuto
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuto -d aiuto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
